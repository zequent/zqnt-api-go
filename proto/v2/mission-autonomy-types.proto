}

// Dynamic config envelope used by mission and task templates.
// `template_config` is the default shape, `overrides` contains user/runtime changes,
// and `decision_config` contains values consumed or produced by the decision engine.
message DynamicConfigProto {
  optional string template_id = 1;
  optional string template_version = 2;
  google.protobuf.Struct template_config = 3;
  google.protobuf.Struct overrides = 4;
  google.protobuf.Struct decision_config = 5;
  optional bool decision_engine_enabled = 6;
}

// Schedulable invocation of a capability discovered through AssetRuntimeSnapshot.
// Mission Autonomy validates params against the advertised input_schema before execution.
message DynamicCommandTaskConfigProto {
  string command_id = 1;
  CapabilityTarget target = 2;
  google.protobuf.Struct params = 3;
  // Schema version observed when the task was planned. If set, execution must reject a
  // capability with a different version instead of running against a changed contract.
  optional string expected_schema_version = 4;
}

message DecisionTriggerProto {
  DecisionTriggerType type = 1;
  optional string event_type = 2;
  google.protobuf.Struct params = 3;
}

message DecisionConditionProto {
  string field_path = 1;
  string operator = 2;
  google.protobuf.Value value = 3;
}

message DecisionConstraintProto {
  string name = 1;
  google.protobuf.Struct params = 2;
  optional string violation_action = 3;
}

message DecisionActionProto {
  DecisionActionType type = 1;
  optional string target_ref = 2;
  google.protobuf.Struct params = 3;
}

message DecisionRuleProto {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  int32 priority = 4;
  repeated DecisionTriggerProto triggers = 5;
  repeated DecisionConditionProto conditions = 6;
  repeated DecisionConstraintProto constraints = 7;
  repeated DecisionActionProto actions = 8;
}

message AutonomyConfigProto {
  bool enabled = 1;
  AutonomyMode mode = 2;
  DecisionStrategyType strategy_type = 3;
  DynamicConfigProto dynamic_config = 4;
  repeated DecisionRuleProto decision_rules = 5;
  optional string policy_scope = 6;
  optional string policy_scope_target = 7;
  optional bool require_human_approval = 8;
  optional float min_confidence = 9;
  optional string fallback_action = 10;
}

