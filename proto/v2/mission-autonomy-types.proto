// Canonical task type enum for mission, command, and SDK DTOs.
// Values 8+ cover RemoteControl actions and edge-device-initiated tasks.
// Use TASK_TYPE_EXTERNAL with the external_task_type string field for anything not listed here.
enum TaskTypeProto {
  TASK_TYPE_UNSPECIFIED = 0;
  // Mission-autonomy task types
  TASK_TYPE_DETECT = 1;
  TASK_TYPE_AREA_MAPPING = 2;
  TASK_TYPE_WAYPOINT = 3;
  TASK_TYPE_POI = 4;
  TASK_TYPE_FOLLOW = 5;
  TASK_TYPE_TRACK = 6;
  TASK_TYPE_COUNTER_DRONE = 7;
  // RemoteControl / edge-device task types
  TASK_TYPE_TAKE_OFF = 8;
  TASK_TYPE_GO_TO = 9;
  TASK_TYPE_RETURN_TO_HOME = 10;
  TASK_TYPE_ENTER_MANUAL_CONTROL = 11;
  TASK_TYPE_EXIT_MANUAL_CONTROL = 12;
  TASK_TYPE_LOOK_AT = 13;
  TASK_TYPE_TAKE_PHOTO = 14;
  TASK_TYPE_OPEN_COVER = 15;
  TASK_TYPE_CLOSE_COVER = 16;
  TASK_TYPE_START_CHARGING = 17;
  TASK_TYPE_STOP_CHARGING = 18;
  TASK_TYPE_REBOOT_ASSET = 19;
  TASK_TYPE_BOOT_SUB_ASSET = 20;
  TASK_TYPE_REMOTE_DEBUG = 21;
  TASK_TYPE_CHANGE_AC_MODE = 22;
  TASK_TYPE_CUSTOM_COMMAND = 23;
  // Catch-all: use together with external_task_type string field
  TASK_TYPE_EXTERNAL = 99;
}

