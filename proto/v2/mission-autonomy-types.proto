message WaypointProtoDTO{
  double latitude = 1;
  double longitude = 2;
  optional float altitude = 3;
  optional float speed = 4;
  optional bool fly_trough = 5;
  optional VehicleAction vehicle_action = 6;
  optional int32 wp_order = 7;
  optional int32 gimbal_pitch = 8;
}

// ========== TASK CONFIG MESSAGES (Type-safe configs matching POJOs) ==========

// Waypoint task configuration - mirrors WaypointTaskConfig.java
message WaypointTaskConfigProto {
  string external_task_id = 1;  // vendor-neutral: DJI=flightId, Mavlink=mission_id, ground robots=route_id
  repeated WaypointProtoDTO waypoints = 2;
  optional FlyToWaylineModeProto fly_to_wayline_mode = 3;
  optional WaylineFinishActionProto wayline_finish_action = 4;
  optional WaylineTypeEnumProto wayline_type = 5;
  optional WaylineTurnModeProto wayline_turn_mode = 6;
  optional bool use_straight_line = 7;
  optional WaylinePrecisionTypeEnumProto wayline_precision_type = 8;
  optional ExitWaylineWhenRcLostEnumProto exit_wayline_when_rc_lost_enum = 9;
  optional RcLostActionEnumProto rc_lost_action_enum = 10;
  optional OutOfControlActionEnumProto out_of_control_action = 11;
  optional float take_off_security_height = 12;
  optional int32 rth_altitude = 13;
  optional RthModeEnumProto rth_mode = 14;
  optional float rth_speed = 15;
  optional float global_speed = 16;
  optional float global_transition_speed = 17;
  optional float global_height = 18;
  optional WaylineGimbalPitchModeProto gimbal_pitch_mode = 19;
  optional int32 global_gimbal_pitch = 20;
  optional string payload_imaging_type = 21;
  optional string file_url = 22;
  optional string file_md5 = 23;
  optional string flight_area_file_url = 24;
  optional string flight_area_checksum = 25;
}

// Detect task configuration - mirrors DetectTaskConfig.java
message DetectTaskConfigProto {
  repeated string detection_targets = 1;
  optional string detection_mode = 2;
  optional double area_latitude = 3;
  optional double area_longitude = 4;
  optional float area_radius = 5;
  optional float detection_altitude = 6;
  optional string scan_pattern = 7;
  optional float scan_speed = 8;
  optional bool thermal_detection = 9;
  optional bool visual_detection = 10;
  optional float min_confidence = 11;
  optional int32 max_detections = 12;
  optional bool auto_capture_on_detection = 13;
  optional bool investigate_detections = 14;
  optional float investigation_distance = 15;
  optional int32 investigation_duration = 16;
  optional int32 gimbal_pitch = 17;
  optional bool enable_zoom = 18;
  optional float zoom_level = 19;
  optional int32 max_duration = 20;
  optional string on_max_detections_action = 21;
  optional bool realtime_alerts = 22;
  optional string ai_model_id = 23;
  repeated DetectionParameterProto detection_parameters = 24;

  message DetectionParameterProto {
    string name = 1;
    string value = 2;
    optional string description = 3;
  }
}

// Area mapping task configuration - mirrors AreaMappingTaskConfig.java
message AreaMappingTaskConfigProto {
  repeated AreaVertexProto area_vertices = 1;
  float survey_altitude = 2;
  optional string flight_pattern = 3;
  optional int32 front_overlap = 4;
  optional int32 side_overlap = 5;
  optional float speed = 6;
  optional int32 gimbal_pitch = 7;
  optional int32 camera_angle = 8;
  optional bool terrain_following = 9;
  optional float ground_sampling_distance = 10;
  optional bool enable3_d_reconstruction = 11;

  message AreaVertexProto {
    double latitude = 1;
    double longitude = 2;
    optional int32 order = 3;
  }
}

// POI task configuration - mirrors PoiTaskConfig.java
message PoiTaskConfigProto {
  double poi_latitude = 1;
  double poi_longitude = 2;
  float poi_altitude = 3;
  optional float orbit_radius = 4;
  optional float orbit_speed = 5;
  optional float flight_altitude = 6;
  optional int32 number_of_orbits = 7;
  optional string orbit_direction = 8;
  optional int32 start_angle = 9;
  optional int32 end_angle = 10;
  optional bool capture_enabled = 11;
  optional int32 capture_interval = 12;
  optional bool lock_camera_on_poi = 13;
}

// Follow task configuration - mirrors FollowTaskConfig.java
message FollowTaskConfigProto {
  string target_type = 1;
  optional double initial_latitude = 2;
  optional double initial_longitude = 3;
  optional float follow_distance = 4;
  optional float relative_altitude = 5;
  optional float max_speed = 6;
  optional string follow_mode = 7;
  optional int32 angle_offset = 8;
  optional bool obstacle_avoidance = 9;
  optional int32 max_duration = 10;
  optional float max_distance_from_start = 11;
  optional string lost_target_action = 12;
  optional int32 lost_target_timeout = 13;
  optional bool lock_camera_on_target = 14;
  optional int32 gimbal_pitch_offset = 15;
  optional bool auto_capture = 16;
  optional int32 capture_interval = 17;
}

// Track task configuration - mirrors TrackTaskConfig.java
message TrackTaskConfigProto {
  string target_type = 1;
  optional double initial_latitude = 2;
  optional double initial_longitude = 3;
  optional float target_altitude = 4;
  optional string tracking_mode = 5;
  optional float max_movement_radius = 6;
  optional float tracking_altitude = 7;
  optional bool gimbal_tracking = 8;
  optional bool auto_zoom = 9;
  optional float zoom_level = 10;
  optional string tracking_sensitivity = 11;
  optional int32 max_duration = 12;
