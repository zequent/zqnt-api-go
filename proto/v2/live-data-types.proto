syntax = "proto3";

package zqnt;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "common.proto";

option java_multiple_files = true;
option java_package = "com.zqnt.utils.livedata.proto";
option java_outer_classname = "LiveDataTypesProto";
option go_package = "gen/livedata/proto";


message LiveDataResponse {
  string tid = 1;
  google.protobuf.Timestamp timestamp = 2;
  bool has_errors = 3;
  string sn = 4;
  optional string asset_id = 5;
  optional string response_message = 6;
  oneof detail {
    Telemetry telemetry = 7;
    google.protobuf.Empty empty = 9;
    GlobalErrorMessage error = 10;
  }
  reserved 8;
}


message StreamTelemetryRequest {
  RequestBase base = 1;
  optional int32 frequency_ms = 2;  // Streaming frequency
  optional int32 duration = 3; // Duration in Seconds
  LiveDataServiceCommand command = 4;
}



message ProduceTelemetryRequest {
  RequestBase base = 1;
  reserved 2;
  oneof telemetry {
    Telemetry data = 3;
    LiveStreamState live_stream_state = 5;
    GlobalErrorMessage error = 6;
  }
  reserved 4;
}

// ========== TELEMETRY RESPONSE MESSAGES ==========

message LiveDataTelemetryResponse {
  string tid = 1;
  google.protobuf.Timestamp timestamp = 2;
  bool has_errors = 3;
  string sn = 4;
  optional string asset_id = 5;
  oneof telemetry {
    Telemetry data = 6;
    GlobalErrorMessage error = 8;
    LiveStreamState live_stream_state = 9;
    LiveDataStreamHeartbeat stream_heartbeat = 10;
    TelemetrySourceStatus source_status = 11;
  }
  reserved 7;
}

// Confirms that the client subscription is alive independently of incoming edge telemetry.
message LiveDataStreamHeartbeat {
  google.protobuf.Timestamp timestamp = 1;
}

// Describes the freshness of telemetry for the requested SN (or the wildcard stream as a whole).
message TelemetrySourceStatus {
  string sn = 1;
  TelemetrySourceState state = 2;
  google.protobuf.Timestamp observed_at = 3;
  optional google.protobuf.Timestamp last_telemetry_at = 4;
}

enum TelemetrySourceState {
  TELEMETRY_SOURCE_STATE_UNSPECIFIED = 0;
  TELEMETRY_SOURCE_STATE_ONLINE = 1;
  TELEMETRY_SOURCE_STATE_STALE = 2;
  TELEMETRY_SOURCE_STATE_NO_DATA = 3;
}

// ========== DETECTION MESSAGES ==========

message LiveDataDetectionResponse {
  string          tid       = 1;
  google.protobuf.Timestamp timestamp = 2;
  bool            has_errors = 3;
  string          sn        = 4;
  optional string asset_id  = 5;
  oneof detail {
    DetectionBatch      detections = 6;
    GlobalErrorMessage  error      = 7;
  }
}

message Telemetry {
  string id = 1;
  google.protobuf.Timestamp timestamp = 2;
  string sn = 3;
  optional double latitude = 4;
  optional double longitude = 5;
  optional float absolute_altitude = 6;
  optional float relative_altitude = 7;
  optional float wind_speed = 8;
  optional float heading = 9;
  oneof source {
    AssetTelemetryDetails asset = 20;
    SubAssetTelemetryDetails sub_asset = 21;
  }
}

message AssetTelemetryDetails {
  optional float environment_temp = 1;
  optional float inside_temp = 2;
  optional float humidity = 3;
  optional AssetMode mode = 4;
  optional RainfallEnum rainfall = 5;
  optional AssetSubAssetInformation sub_asset_information = 6;
  optional bool sub_asset_at_home = 7;
  optional bool sub_asset_charging = 8;
  optional float sub_asset_percentage = 9;
  optional bool debug_mode_open = 10;
  optional bool has_active_manual_control_session = 11;
  optional AssetCoverStateEnum cover_state = 12;
  optional int32 working_voltage = 13;
  optional int32 working_current = 14;
  optional int32 supply_voltage = 15;
  optional bool position_valid = 16;
  optional AssetNetworkInformation network_information = 17;
  optional AssetAirConditioner air_conditioner = 18;
  optional ManualControlStateEnum manual_control_state = 19;
  optional PositionState position_state = 20;
  optional AssetWirelessLinkInformation wireless_link = 21;
  optional AssetSdrState sdr_state = 22;


  message AssetSdrState {
    optional int32 down_quality = 1;
    optional int32 up_quality = 2;
    optional double frequency_band = 3;
  }


  message PositionState{
    optional int32 gps_number = 1;
    optional int32 rtk_number = 2;
    optional int32 quality = 3;
  }


  message AssetAirConditioner{
    optional AssetAirConditionerStateEnum state = 1;
    optional int32 switch_time = 2;
  }
  message AssetNetworkInformation {
    optional NetworkTypeEnum type = 1;
    optional float rate = 2;
    optional NetworkStateQualityEnum quality = 3;

  }
  message AssetWirelessLinkInformation {
    optional float fourth_generation_freq_band = 1;
    optional int32 fourth_generation_gnd_quality = 2;
    optional bool fourth_generation_link_state = 3;
    optional int32 fourth_generation_quality = 4;
    optional int32 fourth_generation_uav_quality = 5;
    optional int32 dongle_number = 6;
    optional string link_workmode = 7;
    optional float sdr_freq_band = 8;
    optional bool sdr_link_state = 9;
    optional int32 sdr_quality = 10;
  }
  message AssetSubAssetInformation{
    optional string sn = 1;
    optional string model = 2;
    optional bool paired = 3;
    optional bool online = 4;
  }
}


message SubAssetTelemetryDetails {
  optional float horizontal_speed = 1;
  optional float vertical_speed = 2;
  optional string wind_direction = 3;
  optional int32 gear = 4;
  optional PayloadTelemetry payload_telemetry = 5;
  optional SubAssetBatteryInformation battery_information = 6;
  optional int32 height_limit = 7;
  optional float home_distance = 8;
  optional double total_movement_distance = 9;
  optional double total_movement_time = 10;
  optional SubAssetMode mode = 11;
  optional string country = 12;
  repeated ComponentTelemetry component_telemetry = 13;



  message SubAssetBatteryInformation{
    optional string percentage = 1;
    optional int32 remaining_time = 2;
    optional string return_to_home_power = 3;
  }

}

message ComponentTelemetry {
  string component_id = 1;
  optional string external_id = 2;
  optional string kind = 3;
  google.protobuf.Timestamp timestamp = 4;
  optional PayloadTelemetry.CameraData camera_data = 5;
  optional PayloadTelemetry.RangeFinderData range_finder_data = 6;
  optional PayloadTelemetry.SensorData sensor_data = 7;
  google.protobuf.Struct attributes = 20;
}



message PayloadTelemetry {
  string id = 1;
  google.protobuf.Timestamp timestamp = 2;
  optional CameraData camera_data = 3;
  optional RangeFinderData range_finder_data = 4;
  optional SensorData sensor_data = 5;
  string name = 6;



  message CameraData{
    optional string current_lens = 1;
    optional float gimbal_pitch = 2;
    optional float gimbal_yaw = 3;
    optional float zoom_factor = 4;
    optional float gimbal_roll = 5;
  }

  message RangeFinderData{
    optional double target_latitude = 1;
    optional double target_longitude = 2;
    optional float target_distance = 3;
    optional float target_altitude = 4;
  }

  message SensorData{
    optional float target_temperature = 1;
  }
}
