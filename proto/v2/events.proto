syntax = "proto3";

package zqnt;

import "common.proto";
import "capability-execution-dto.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.zqnt.utils.events.proto";
option java_outer_classname = "EventsProto";
option go_package = "gen/events/proto";

enum NotificationEventType {
  reserved 2; // NOTIFICATION_EVENT_TASK — retired with the legacy Task/Mission model; all edges migrated to CommandExecutionEvent.
  reserved "NOTIFICATION_EVENT_TASK";
  NOTIFICATION_EVENT_UNSPECIFIED = 0;
  NOTIFICATION_EVENT_ASSET_STATUS = 1;
  NOTIFICATION_EVENT_MISSION = 3;
  NOTIFICATION_EVENT_ASSET_RUNTIME = 4;
  NOTIFICATION_EVENT_CAPABILITY_EXECUTION = 5;
  NOTIFICATION_EVENT_COMMAND_EXECUTION = 6;
  NOTIFICATION_EVENT_LIVE_STREAM_CAPABILITY = 7;
}

enum NotificationSeverity {
  NOTIFICATION_SEVERITY_INFO = 0;
  NOTIFICATION_SEVERITY_WARN = 1;
  NOTIFICATION_SEVERITY_CRITICAL = 2;
}

enum NotificationSourceState {
  NOTIFICATION_SOURCE_STATE_UNSPECIFIED = 0;
  NOTIFICATION_SOURCE_STATE_ONLINE = 1;
  NOTIFICATION_SOURCE_STATE_STALE = 2;
  NOTIFICATION_SOURCE_STATE_NO_DATA = 3;
}

// Confirms that the notification subscription is alive independently of incoming events.
message NotificationStreamHeartbeat {
  google.protobuf.Timestamp timestamp = 1;
}

// Describes notification freshness for the requested SN (or wildcard stream).
message NotificationSourceStatus {
  string sn = 1;
  NotificationSourceState state = 2;
  google.protobuf.Timestamp observed_at = 3;
  optional google.protobuf.Timestamp last_notification_at = 4;
}

message AssetStatusEvent {
  string sn = 1;
  optional string asset_id = 2;
  optional bool online = 3;
  optional string message = 4;
}

// Vendor-neutral lifecycle feedback for one physical command dispatched to an edge adapter.
enum CommandExecutionStatus {
  COMMAND_EXECUTION_STATUS_UNSPECIFIED = 0;
  COMMAND_EXECUTION_STATUS_ACCEPTED = 1;
  COMMAND_EXECUTION_STATUS_RUNNING = 2;
  COMMAND_EXECUTION_STATUS_SUCCEEDED = 3;
  COMMAND_EXECUTION_STATUS_FAILED = 4;
  COMMAND_EXECUTION_STATUS_CANCELLED = 5;
}

message CommandExecutionEvent {
  string external_execution_id = 1;
  optional string command_id = 2;
  CommandExecutionStatus status = 3;
  optional float progress = 4;
  optional string message = 5;
  google.protobuf.Struct output = 6;
  optional GlobalErrorMessage error = 7;
  google.protobuf.Timestamp occurred_at = 8;
  string asset_sn = 9;
}

message MissionEvent {
  string mission_id = 1;
  MissionType mission_type = 2;
  MissionStatus status = 3;
  optional string message = 4;
}

// Emitted by Remote Control when a pushed runtime revision changes or its TTL
// transitions between CURRENT, STALE, and NO_DATA. Clients then reload payloads
// and capabilities from their respective query APIs.
message AssetRuntimeEvent {
  string sn = 1;
  optional string asset_id = 2;
  string revision = 3;
  google.protobuf.Timestamp observed_at = 4;
  optional google.protobuf.Timestamp valid_until = 5;
  CapabilitySnapshotState snapshot_state = 6;
}

// An edge adapter reporting that a camera can stream right now -- or has stopped being able to.
//
// It exists so that an adapter never starts a stream on its own. A publishing credential is minted
// by the platform, for one path, one direction and minutes; an adapter has no access to the key
// store and cannot mint one, so a device that "auto-starts" from a URL stored on its asset is
// publishing with whatever credential was written there months ago -- or, against a media server
// that authenticates, not publishing at all.
//
// With this the adapter states the fact and the platform decides: same StartLiveStream command, same
// freshly minted URL, whether a user pressed the button or a drone simply became ready.
message LiveStreamCapabilityEvent {
  // The device that can stream -- for a DJI dock this is the aircraft, not the dock.
  string sn = 1;
  optional string asset_id = 2;
  // Whether it can stream now. False is the withdrawal, and the platform stops the stream.
  bool available = 3;
  // The vendor's own identifier for the camera to use, opaque to the platform and passed straight
  // back in the start command (DJI: "<sn>/<cameraIndex>/<videoIndex>").
  optional string video_id = 4;
  // The asset that routes commands to it: a sub-asset is reached through its gateway.
  optional string gateway_sn = 5;
}

message NotificationEvent {
  reserved 2; // task — retired with the legacy Task/Mission model; all edges migrated to CommandExecutionEvent.
  reserved "task";
  oneof event {
    AssetStatusEvent asset_status = 1;
    MissionEvent mission = 3;
    GlobalErrorMessage error = 4;
    AssetRuntimeEvent asset_runtime = 5;
    SkillExecutionEventProto skill_execution = 6;
    CommandExecutionEvent command_execution = 7;
    LiveStreamCapabilityEvent live_stream_capability = 8;
  }
}

message StreamNotificationsRequest {
  RequestBase base = 1;
  repeated NotificationEventType event_types = 2;
}

message ProduceNotificationRequest {
  RequestBase base = 1;
  NotificationEvent event = 2;
  NotificationSeverity severity = 3;
  NotificationEventType event_type = 4;
}

message NotificationResponse {
  string tid = 1;
  google.protobuf.Timestamp timestamp = 2;
  bool has_errors = 3;
  string sn = 4;
  optional string asset_id = 5;
  oneof detail {
    NotificationEvent event = 6;
    NotificationStreamHeartbeat stream_heartbeat = 7;
    NotificationSourceStatus source_status = 8;
    GlobalErrorMessage error = 9;
  }
}
