message RegenerateEventTriggerWebhookTokenRequest {
  RequestBase base = 1;
  string id = 2;
}

// The webhook firing path (admin-console) looks a trigger up by the token an inbound POST
// presents, not by id -- the caller (an external system) only ever knows the token.
message GetEventTriggerByWebhookTokenRequest {
  RequestBase base = 1;
  string token = 2;
}

message ConnectorEventTriggerResponse {
  string tid = 1;
  bool has_errors = 2;
  google.protobuf.Timestamp timestamp = 3;
  oneof response {
    GlobalErrorMessage error = 4;
    EventTriggerProtoDTOList event_trigger_list = 5;
  }
}

message ConnectorEventTriggerSingleResponse {
  string tid = 1;
  bool has_errors = 2;
  google.protobuf.Timestamp timestamp = 3;
  oneof response {
    GlobalErrorMessage error = 4;
    EventTriggerProtoDTO event_trigger = 5;
  }
}

message ConnectorDeleteEventTriggerResponse {
  string tid = 1;
  bool has_errors = 2;
  google.protobuf.Timestamp timestamp = 3;
  bool deleted = 4;
  optional GlobalErrorMessage error = 5;
}

message DetectionSummaryProtoDTO {
  string id = 1;
  string asset_sn = 2;
  string object_type = 3;
  optional float confidence = 4;
  google.protobuf.Timestamp detected_at = 5;
  optional string object_id = 6;
  optional DetectionPosition position = 7;
}

message ListRecentDetectionsRequest {
  RequestBase base = 1;
  google.protobuf.Timestamp since = 2;
  optional string asset_sn = 3;
  optional string object_type = 4;
  optional float min_confidence = 5;
}

message ConnectorDetectionListResponse {
  string tid = 1;
  bool has_errors = 2;
  google.protobuf.Timestamp timestamp = 3;
  repeated DetectionSummaryProtoDTO detections = 4;
  optional GlobalErrorMessage error = 5;
}

message GetLatestTelemetryForAssetRequest {
  RequestBase base = 1;
  string asset_sn = 2;
}

message ConnectorTelemetrySingleResponse {
  string tid = 1;
  bool has_errors = 2;
  google.protobuf.Timestamp timestamp = 3;
  oneof response {
    GlobalErrorMessage error = 4;
    AssetTelemetryProto telemetry = 5;
  }
}

// ========== TECHNICAL CONFIG ==========

message TechnicalConfigProtoDTO {
  string id = 1;
  string config_key = 2;
  optional string config_value = 3;
  string value_type = 4;
  string scope = 5;
  optional string scope_target = 6;
  bool active = 7;
  optional string description = 8;
  optional string organization_id = 9;
  optional google.protobuf.Timestamp created_at = 10;
  optional google.protobuf.Timestamp modified_at = 11;
}

message TechnicalConfigProtoDTOList {
  repeated TechnicalConfigProtoDTO configs = 1;
}

message ConnectorGetConfigsRequest {
  RequestBase base = 1;
  optional string scope = 2;
  optional string scope_target = 3;
  // False (default) matches every prior caller's expectation (ConfigSyncService's runtime-cache
  // sync included) -- only the admin console's "show deactivated configs" view sets this true.
  bool include_inactive = 4;
}

message ConnectorConfigResponse {
  string tid = 1;
  bool has_errors = 2;
  google.protobuf.Timestamp timestamp = 3;
  oneof response {
    GlobalErrorMessage error = 4;
    TechnicalConfigProtoDTOList config_list = 5;
  }
}

message GetTechnicalConfigByIdRequest {
  RequestBase base = 1;
  string id = 2;
}

message CreateTechnicalConfigRequest {
  RequestBase base = 1;
  TechnicalConfigProtoDTO config = 2;
}

message UpdateTechnicalConfigRequest {
  RequestBase base = 1;
  string id = 2;
  TechnicalConfigProtoDTO config = 3;
}

message DeleteTechnicalConfigRequest {
  RequestBase base = 1;
  string id = 2;
}

message ConnectorConfigSingleResponse {
  string tid = 1;
  bool has_errors = 2;
  google.protobuf.Timestamp timestamp = 3;
  oneof response {
    GlobalErrorMessage error = 4;
    TechnicalConfigProtoDTO config = 5;
  }
}

message ConnectorDeleteConfigResponse {
  string tid = 1;
  bool has_errors = 2;
  google.protobuf.Timestamp timestamp = 3;
  bool deleted = 4;
  optional GlobalErrorMessage error = 5;
}
