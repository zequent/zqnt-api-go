syntax = "proto3";

package zqnt;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "common.proto";
import "events.proto";
import "mission-autonomy-contracts.proto";
import "mission-autonomy-dto.proto";
import "capability-execution-contracts.proto";
import "capability-execution-dto.proto";
import "device-control-contracts.proto";
import "media.proto";


option java_multiple_files = true;
option java_package = "com.zqnt.utils.connector.proto";
option java_outer_classname = "ConnectorProto";
option go_package = "gen/connector/proto";




// ConnectorService owns persisted asset metadata, workflow persistence,
// telemetry/detection storage, policies, and runtime technical configuration.
service ConnectorService {

  rpc RegisterAsset(ConnectorRegisterAssetRequest) returns (ConnectorResponse);
  rpc DeregisterAsset(RequestBase) returns (ConnectorResponse);
  rpc AssetMonitoring(RequestBase) returns (stream AssetMonitoringResponse);
  rpc UpdateAsset(ConnectorUpdateAssetRequest) returns (ConnectorResponse);
  rpc UpdateSubAsset(ConnectorUpdateSubAssetRequest) returns (ConnectorResponse);
  rpc GetAssetBySn(RequestBase) returns (ConnectorResponse);
  rpc GetAssetById(ConnectorGetAssetByIdRequest) returns (ConnectorResponse);
  rpc GetSubAssetBySn(RequestBase) returns (ConnectorResponse);
  // Every asset that exists for the caller's organization (every asset platform-wide for a
  // system_admin caller — same bypass-tenant-filtering rule as everywhere else), regardless of
  // whether it's currently reporting itself online. Distinct from AssetMonitoring's streamed
  // ConnectorAssetList (that's live/cached status snapshots for already-known SNs); this is the
  // actual system-of-record enumeration — there was no way to list assets at all before this RPC,
  // only look one up by a SN you already knew.
  rpc ListAssets(ListAssetsRequest) returns (AssetListResponse);
  // Asset claims — one-time provisioning codes. An asset's organization is decided once and can
  // never be changed (ListAssets filters on asset.organization.id, and UpdateAsset pins the field),
  // so a device that registers itself must be told which tenant it belongs to before the asset
  // exists. A claim carries that decision from the operator who made it to the device that
  // redeems it.
  rpc CreateAssetClaim(CreateAssetClaimRequest) returns (AssetClaimResponse);
  // The one RPC here that does not resolve its organization from the caller's token: the claim
  // code IS the credential, which is what lets an edge adapter with no platform identity redeem
  // one. Refusals are deliberately indistinguishable from one another — an expired code and an
  // unknown code answer alike, or this becomes an oracle for guessing codes.
  rpc RedeemAssetClaim(RedeemAssetClaimRequest) returns (ConnectorResponse);
  // Read a code without spending it, so a device can show its operator which organization they are
  // about to bind into before anything is created. DJI's dock asks for exactly this: it resolves a
  // typed code to an organization name for confirmation, and only the following bind carries the
  // device serials. Untokened like RedeemAssetClaim, and refuses identically — but it returns the
  // organization's NAME and nothing else, so a correct guess reveals a label the operator was
  // about to be shown anyway rather than an id anything can be done with.
  rpc DescribeAssetClaim(DescribeAssetClaimRequest) returns (AssetClaimDescriptionResponse);
  rpc ListAssetClaims(ListAssetClaimsRequest) returns (AssetClaimListResponse);
  rpc RevokeAssetClaim(RevokeAssetClaimRequest) returns (AssetClaimResponse);

  rpc UpsertAssetPayload(UpsertAssetPayloadRequest) returns (AssetPayloadResponse);
  rpc ListAssetPayloads(ListAssetPayloadsRequest) returns (AssetPayloadListResponse);
  rpc DeleteAssetPayload(DeleteAssetPayloadRequest) returns (AssetPayloadResponse);

  // Dynamic per-asset property bag (system-integrator metadata) — free key/value pairs, no schema
  // change needed to add a new one. SetAssetProperty upserts by (asset, key).
  rpc SetAssetProperty(SetAssetPropertyRequest) returns (AssetPropertyResponse);
  rpc ListAssetProperties(ListAssetPropertiesRequest) returns (AssetPropertyListResponse);
  rpc DeleteAssetProperty(DeleteAssetPropertyRequest) returns (AssetPropertyResponse);
  rpc GetOrganization(ConnectorGetOrganizationRequest) returns (ConnectorResponse);
  rpc ListSchedulers(ListSchedulersRequest) returns (SchedulerResponse);
  rpc GetScheduler(GetSchedulerRequest) returns (SchedulerResponse);
  rpc CreateScheduler(CreateSchedulerRequest) returns (SchedulerResponse);
  rpc CreateSchedulers(CreateSchedulersRequest) returns (SchedulerResponse);
  rpc UpdateScheduler(UpdateSchedulerRequest) returns (SchedulerResponse);
  rpc DeleteScheduler(DeleteSchedulerRequest) returns (SchedulerResponse);
  rpc DeleteSchedulers(DeleteSchedulersRequest) returns (SchedulerResponse);
  // What the last firing of a schedule did; see RecordSchedulerFiringRequest.
  rpc RecordSchedulerFiring(RecordSchedulerFiringRequest) returns (SchedulerResponse);

  // Telemetry Storage - batch processing from live-data service
  rpc StoreTelemetryBatch(stream ConnectorStoreTelemetryRequest) returns (ConnectorResponse);

  // Detection Storage - batch processing from live-data service (high-frequency, TimescaleDB)
  rpc StoreDetectionBatch(stream ConnectorStoreDetectionRequest) returns (ConnectorResponse);

  // Notification Storage - batch processing from live-data service
  rpc StoreNotificationBatch(stream ProduceNotificationRequest) returns (ConnectorResponse);

  // Media a device uploaded to the inbox bucket (see media.proto): attributed, moved under its
  // organization/application folder and recorded. Idempotent per source object key.
  rpc RegisterMediaFile(RegisterMediaFileRequest) returns (MediaFileProtoDTO);
  rpc ListMediaFiles(ListMediaFilesRequest) returns (ListMediaFilesResponse);
  rpc GetMediaFile(GetMediaFileRequest) returns (MediaFileProtoDTO);

  // Policy Management - fetched by Mission-Autonomy for decision engine cache. Read-only RPCs
  // existed first; the CRUD RPCs below back the admin-console "Operational Policies" management
  // screen (previously a fully mocked/hardcoded frontend with no backend at all -- see
  // OperationalPolicyService, which already did real persistence + push-invalidation eventing for
  // the REST-only connector-internal API these now also front).
  rpc GetActivePoliciesByType(ConnectorGetPoliciesRequest) returns (ConnectorPolicyResponse);
  rpc GetAllActivePolicies(ConnectorGetAllPoliciesRequest) returns (ConnectorPolicyResponse);
  rpc GetPolicyById(GetPolicyByIdRequest) returns (ConnectorPolicySingleResponse);
  rpc CreatePolicy(CreatePolicyRequest) returns (ConnectorPolicySingleResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (ConnectorPolicySingleResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (ConnectorDeletePolicyResponse);

  // Organization Management - connector's own OrganizationService already had full REST CRUD
  // (/api/organization, orphaned/never called from outside connector, same shape as the old
  // OperationalPolicy REST API) -- these RPCs are the real cross-service front door for it, backing
  // the admin-console "Organizations" management screen.
  rpc GetAllOrganizations(ConnectorGetAllOrganizationsRequest) returns (ConnectorOrganizationResponse);
  rpc GetOrganizationById(GetOrganizationByIdRequest) returns (ConnectorOrganizationSingleResponse);
  rpc CreateOrganization(CreateOrganizationRequest) returns (ConnectorOrganizationSingleResponse);
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (ConnectorOrganizationSingleResponse);
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (ConnectorDeleteOrganizationResponse);
  // Creates the organization a license names, with the id the license carries (the only way an
  // organization gets a caller-chosen id), and stores that license's sealed activation credentials
  // in the same transaction -- both or neither. An id that already exists is not changed and nothing
  // is written: already_exists = true and organization holds the existing one, so the caller can
  // treat it as activating a license for an existing organization.
  rpc ProvisionLicensedOrganization(ProvisionLicensedOrganizationRequest) returns (ProvisionLicensedOrganizationResponse);

  // Theatre Management - a named operational site within one organization (optional geo zone, the
  // assets stationed there, the users with access to it). Same CRUD shape as Organization above;
  // AssignUserToTheatre/RemoveUserFromTheatre back the many-to-many user<->theatre join table
  // (deliberately not a repeated field on TheatreProtoDTO -- resolved fresh per request, same
  // "don't bake something that can change independently into a cached/long-lived value" reasoning
  // as the refresh-token roles fix).
  rpc GetAllTheatres(ConnectorGetAllTheatresRequest) returns (ConnectorTheatreResponse);
  rpc GetTheatreById(GetTheatreByIdRequest) returns (ConnectorTheatreSingleResponse);
  rpc CreateTheatre(CreateTheatreRequest) returns (ConnectorTheatreSingleResponse);
  rpc UpdateTheatre(UpdateTheatreRequest) returns (ConnectorTheatreSingleResponse);
  rpc DeleteTheatre(DeleteTheatreRequest) returns (ConnectorDeleteTheatreResponse);
  rpc AssignUserToTheatre(AssignUserToTheatreRequest) returns (TheatreAssignmentResponse);
  rpc RemoveUserFromTheatre(RemoveUserFromTheatreRequest) returns (TheatreAssignmentResponse);

  // No-fly zones -- the one store of an organization's no-fly zones. Mission-autonomy reads them to
  // plan and refuse flights (RouteExecutionGraphExpander), admin-console to draw and edit them.
  // Ids are chosen by the caller (the console's own ids survive the move from Redis). An id that
  // belongs to another organization is answered as not found.
  rpc ListNoFlyZones(ListNoFlyZonesRequest) returns (NoFlyZoneListResponse);
  rpc UpsertNoFlyZone(UpsertNoFlyZoneRequest) returns (NoFlyZoneSingleResponse);
  rpc DeleteNoFlyZone(DeleteNoFlyZoneRequest) returns (DeleteNoFlyZoneResponse);

  // License activation credentials -- the activation id and token admin-console received from the
  // license hub when it activated an organization's license. Without them admin-console can neither
  // refresh that organization's lease nor consume its seats, so they must survive a restart and be
  // shared between replicas. admin-console seals the token before it gets here (AES-256-GCM under a
  // per-organization key derived from the installation's platform key); connector stores the
  // envelope and never sees the token itself. At most one record per organization; Put replaces it.
  rpc ListLicenseActivationCredentials(ListLicenseActivationCredentialsRequest) returns (LicenseActivationCredentialsListResponse);
  rpc GetLicenseActivationCredentials(GetLicenseActivationCredentialsRequest) returns (LicenseActivationCredentialsSingleResponse);
  rpc PutLicenseActivationCredentials(PutLicenseActivationCredentialsRequest) returns (LicenseActivationCredentialsSingleResponse);
  rpc DeleteLicenseActivationCredentials(DeleteLicenseActivationCredentialsRequest) returns (DeleteLicenseActivationCredentialsResponse);

  // Event Triggers — "start Application X on event Y" (detection / telemetry threshold / asset
  // status / inbound webhook). CRUD mirrors Theatre's shape; ListRecentDetections and
  // GetLatestTelemetryForAsset back mission-autonomy's polling evaluator (EventTriggerEvaluationService),
  // RecordEventTriggerFired stamps last_fired_at for cooldown bookkeeping after a real fire.
  rpc GetAllEventTriggers(ConnectorGetAllEventTriggersRequest) returns (ConnectorEventTriggerResponse);
  rpc GetEventTriggerById(GetEventTriggerByIdRequest) returns (ConnectorEventTriggerSingleResponse);
  rpc CreateEventTrigger(CreateEventTriggerRequest) returns (ConnectorEventTriggerSingleResponse);
  rpc UpdateEventTrigger(UpdateEventTriggerRequest) returns (ConnectorEventTriggerSingleResponse);
  rpc DeleteEventTrigger(DeleteEventTriggerRequest) returns (ConnectorDeleteEventTriggerResponse);
  rpc RecordEventTriggerFired(RecordEventTriggerFiredRequest) returns (ConnectorEventTriggerSingleResponse);
  rpc RegenerateEventTriggerWebhookToken(RegenerateEventTriggerWebhookTokenRequest) returns (ConnectorEventTriggerSingleResponse);
  rpc GetEventTriggerByWebhookToken(GetEventTriggerByWebhookTokenRequest) returns (ConnectorEventTriggerSingleResponse);
  rpc ListRecentDetections(ListRecentDetectionsRequest) returns (ConnectorDetectionListResponse);
  rpc GetLatestTelemetryForAsset(GetLatestTelemetryForAssetRequest) returns (ConnectorTelemetrySingleResponse);

  // Technical Config - fetched by services for runtime configuration. Read-only GetTechnicalConfigs
  // existed first (services reading their own settings); the CRUD RPCs below back the admin-console
  // "Technical Config" management screen, so the config values these read-only fetches see can
  // actually be changed by an admin without a redeploy.
  rpc GetTechnicalConfigs(ConnectorGetConfigsRequest) returns (ConnectorConfigResponse);
  rpc GetTechnicalConfigById(GetTechnicalConfigByIdRequest) returns (ConnectorConfigSingleResponse);
  rpc CreateTechnicalConfig(CreateTechnicalConfigRequest) returns (ConnectorConfigSingleResponse);
  rpc UpdateTechnicalConfig(UpdateTechnicalConfigRequest) returns (ConnectorConfigSingleResponse);
  rpc DeleteTechnicalConfig(DeleteTechnicalConfigRequest) returns (ConnectorDeleteConfigResponse);

  // Application/Skill domain persistence. Mission Autonomy is the orchestration consumer.
  rpc PersistApplication(UpsertApplicationRequest) returns (ApplicationResponse);
  rpc GetPersistedApplication(GetApplicationRequest) returns (ApplicationResponse);
  rpc ListPersistedApplications(ListApplicationsRequest) returns (ApplicationListResponse);
  rpc DeletePersistedApplication(DeleteApplicationRequest) returns (ApplicationResponse);
  // Pausing is operational state, not part of the versioned Application -- see ApplicationPauseProtoDTO.
  // SetApplicationPause answers with every pause of that Application after the change.
  rpc SetApplicationPause(SetApplicationPauseRequest) returns (ApplicationPauseListResponse);
  rpc ListApplicationPauses(ListApplicationPausesRequest) returns (ApplicationPauseListResponse);
  rpc GetApplicationEnvironmentPointers(GetApplicationEnvironmentsRequest) returns (ApplicationEnvironmentsResponse);
  rpc PromoteApplicationVersion(PromoteApplicationVersionRequest) returns (ApplicationEnvironmentsResponse);
  rpc PersistSkillExecution(PersistSkillExecutionRequest) returns (SkillExecutionResponse);
  rpc GetPersistedSkillExecution(GetSkillExecutionRequest) returns (SkillExecutionResponse);
  rpc ListPersistedSkillExecutions(ListSkillExecutionsRequest) returns (SkillExecutionListResponse);
  rpc AppendSkillExecutionEvent(AppendSkillExecutionEventRequest) returns (google.protobuf.Empty);

  // Skill Registry: a persisted, de-duplicated view of every Skill/Capability contract ever
  // observed from a connected asset, independent of which devices are currently online. Admin
  // Console auto-upserts into this by (command_id, schema_version) whenever it aggregates a live
  // capability snapshot; status is the one field a system integrator edits directly.
  rpc ObserveSkillContract(UpsertSkillContractRequest) returns (SkillContractResponse);
  rpc ListSkillContracts(ListSkillContractsRequest) returns (SkillContractListResponse);
  rpc SetSkillContractStatus(SetSkillContractStatusRequest) returns (SkillContractResponse);
  // Declarative-only prep for future auth/RBAC — see SkillContractProtoDTO.required_permissions.
  rpc SetSkillContractPermissions(SetSkillContractPermissionsRequest) returns (SkillContractResponse);

  // Platform-hosted authentication: verifies email+password against connector's own user store
  // (the system of record) and returns the identity a caller (admin-console) mints a
  // PlatformClaims-shaped auth token from. Connector never issues the token itself — it has no
  // private signing key — it only ever confirms "this is who they say they are, in this org, with
  // these roles."
  rpc AuthenticateUser(AuthenticateUserRequest) returns (AuthenticateUserResponse);

  // Admin-driven user creation — the seat check (does this organization's license have room for
  // one more user) happens one layer up, in admin-console's LicenseCoordinator, BEFORE this is
  // ever called; connector itself has no concept of seats, it only persists the user once
  // admin-console has already confirmed one is available.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // Admin-driven password reset — see ResetPasswordRequest's doc.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);

  // Durable audit trail for authentication-security-relevant events (login attempts, logout,
  // admin-driven password resets/session revocations) — see the connector-side AuthAuditService's
  // doc. Best-effort from the caller's point of view: a failure to record must never block the
  // actual auth action it's describing, so every call site fires this without letting its outcome
  // affect the real response.
  rpc RecordAuthAuditEvent(RecordAuthAuditEventRequest) returns (google.protobuf.Empty);

  // Every user in the caller's own organization (a system_admin caller instead gets every user,
  // platform-wide — same bypass-tenant-filtering rule as everywhere else, see
  // TenantScopedRepository#bypassTenantFilter). What the admin console's user-management screen
  // lists against; there was no read path for the users CreateUser produces until this existed.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // Single-user lookup by id — what a "whoami" endpoint resolves an access token's subject claim
  // (a user id, nothing else) into a displayable identity. AuthenticateUser can't serve this: it
  // needs a password and is keyed by email, neither of which a bearer token carries.
  rpc GetUserById(GetUserByIdRequest) returns (AuthenticateUserResponse);

  // Admin-driven user changes. Each answers with the user as it is afterwards (DeleteUser: as it was
  // just before it went), so the caller knows the organization to act on -- revoking sessions,
  // releasing the license seat -- without a second lookup. Same caller rules as CreateUser: an
  // org-admin acts only inside their own organization and never on a system_admin; nobody acts on
  // themselves, and the last enabled system_admin can be neither demoted, disabled nor deleted.
  rpc UpdateUserRoles(UpdateUserRolesRequest) returns (AuthenticateUserResponse);
  // A disabled user can no longer sign in (password or SSO) and no refresh succeeds; the caller
  // revokes live access tokens. Seats are a licensing concern one layer up: disabling keeps it.
  rpc SetUserEnabled(SetUserEnabledRequest) returns (AuthenticateUserResponse);
  // Removes the user for good -- the email is free again. The auth audit trail keeps its rows.
  rpc DeleteUser(DeleteUserRequest) returns (AuthenticateUserResponse);

  // Pluggable SSO — an organization's own OIDC identity provider config (issuer, client
  // credentials, which email domains it owns, how its claims map to platform roles). Local
  // email+password (AuthenticateUser above) stays the default for every org with no config here;
  // this only ever supplements it, never replaces AuthenticateUser for orgs that don't opt in.
  rpc UpsertIdentityProvider(UpsertIdentityProviderRequest) returns (IdentityProviderResponse);
  rpc GetIdentityProvider(GetIdentityProviderRequest) returns (IdentityProviderResponse);
  // Login-screen discovery: given an email address, which org (if any) owns that domain and has
  // SSO configured — admin-console calls this before showing a password field or redirecting to
  // an IdP. Empty response (no error, no provider) means "no SSO for this domain, use local auth."
  rpc FindIdentityProviderByEmailDomain(FindIdentityProviderByEmailDomainRequest) returns (IdentityProviderResponse);

  // Existence check by (organization_id, external_subject), used by admin-console to decide
  // whether an SSO login needs a seat reserved before UpsertOidcUser below — same "reserve the
  // seat, THEN create" ordering CreateUser's caller already follows for local users. Empty
  // response (has_errors false, no user) means "not provisioned yet."
  rpc FindOidcUser(FindOidcUserRequest) returns (AuthenticateUserResponse);

  // The OIDC counterpart to AuthenticateUser: admin-console has already completed the
  // authorization-code exchange and verified the ID token against the org's own IdP by the time
  // this is called — this only resolves the local user record admin-console mints a
  // PlatformClaims-shaped token from, same as AuthenticateUser does for password logins. Finds by
  // (organization_id, external_subject); auto-provisions on first login (a seat is expected to
  // already be reserved via FindOidcUser+LicenseCoordinator, same division of responsibility as
  // CreateUser — connector has no concept of seats), and re-stamps email/roles from the IdP's
  // claims on every subsequent login so a role change in the customer's own directory takes
  // effect without any action on this platform.
  rpc UpsertOidcUser(UpsertOidcUserRequest) returns (AuthenticateUserResponse);
}

message AuthenticateUserRequest {
  RequestBase base = 1;
  string email = 2;
  string password = 3;
}

// What the caller (admin-console) actually mints an auth token's claims from — see
// com.zqnt.utils.auth.PlatformClaims, which this shape deliberately mirrors field-for-field.
message AuthenticatedUserProtoDTO {
  string user_id = 1;
  string email = 2;
  // Absent only for a system_admin — not scoped to any single organization by design.
  optional string organization_id = 3;
  repeated string roles = 4;
  bool enabled = 5;
  google.protobuf.Timestamp created_at = 6;
  // How the user signs in: "LOCAL" (email + password) or "OIDC" (the organization's SSO, whose
  // role mapping owns the roles). Absent from servers that predate it.
  optional string provider = 7;
}

message AuthenticateUserResponse {
  bool has_errors = 1;
  ResponseMeta meta = 2;
  oneof response {
    AuthenticatedUserProtoDTO user = 3;
    GlobalErrorMessage error = 4;
  }
}

message CreateUserRequest {
  RequestBase base = 1;
  // Absent only when creating a system_admin (see AuthenticatedUserProtoDTO.organization_id) —
  // every other user must belong to an organization.
  optional string organization_id = 2;
  string email = 3;
  string password = 4;
  repeated string roles = 5;
  // Caller-supplied when the id needs to be known BEFORE this call — e.g. admin-console reserves
  // a license seat under this exact id first (so the hub's LicenseSeat.userId and this row's id
  // are the same value from the start, not reconciled after the fact), then creates the row here.
  // Server-generated if absent.
  optional string user_id = 6;
}

message CreateUserResponse {
  bool has_errors = 1;
  ResponseMeta meta = 2;
  oneof response {
    AuthenticatedUserProtoDTO user = 3;
    GlobalErrorMessage error = 4;
  }
}

// Admin-driven password reset — generates and persists a fresh random password for an existing
// user, same one-time-display temporary-password convention CreateUserRequest already uses.
// Deliberately doesn't touch session revocation itself (see UserAdminService#resetPassword's doc);
// the caller (admin-console) revokes the user's outstanding sessions once this succeeds.
message ResetPasswordRequest {
  RequestBase base = 1;
  string user_id = 2;
}

message ResetPasswordResponse {
  bool has_errors = 1;
  ResponseMeta meta = 2;
  oneof response {
    // The new plaintext password — shown to the caller exactly once, same as CreateUserResponse's
    // temporary password never being persisted anywhere in plaintext beyond this one response.
    string new_password = 3;
    GlobalErrorMessage error = 4;
  }
}

message RecordAuthAuditEventRequest {
  RequestBase base = 1;
  // One of com.zqnt.utils.auth.AuthAuditEventType's LOGIN_SUCCESS/LOGIN_FAILURE/LOGOUT/PASSWORD_RESET/
  // SESSIONS_REVOKED constants — a plain string, not an enum, so a new event type doesn't need a
  // proto/codegen change to start being recorded.
  string event_type = 2;
  optional string user_id = 3;
  optional string organization_id = 4;
  optional string email = 5;
  optional string source_ip = 6;
  optional string detail = 7;
}

message ListUsersRequest {
  RequestBase base = 1;
}

message ListUsersResponse {
  bool has_errors = 1;
  ResponseMeta meta = 2;
  repeated AuthenticatedUserProtoDTO users = 3;
  GlobalErrorMessage error = 4;
}

message GetUserByIdRequest {
  RequestBase base = 1;
  string user_id = 2;
}

// Replaces the user's roles with exactly this set (not a merge); at least one role.
message UpdateUserRolesRequest {
  RequestBase base = 1;
  string user_id = 2;
  repeated string roles = 3;
}

message SetUserEnabledRequest {
  RequestBase base = 1;
  string user_id = 2;
  bool enabled = 3;
}

message DeleteUserRequest {
  RequestBase base = 1;
  string user_id = 2;
}

// One organization's OIDC configuration — at most one per organization_id. client_secret IS
// echoed back on GetIdentityProvider/discovery at this gRPC layer — this shape only ever crosses
// trusted service-to-service traffic (connector <-> admin-console), and admin-console's OIDC
// token exchange genuinely needs the real secret. The write-only guarantee is enforced one layer
// up, at admin-console's REST boundary: IdentityProviderAdminAPIImpl maps this into
// IdentityProviderConfigSummary (no secret field at all) before anything reaches a browser, and
// the login/discover flow never threads getClientSecret() into anything sent back to one either.
message IdentityProviderConfigProtoDTO {
  string organization_id = 1;
  string issuer_url = 2;
  string client_id = 3;
  string client_secret = 4;
  // Domains this org's SSO owns for login-screen discovery (e.g. "customer.com"). Globally unique
  // across the installation — a domain can belong to at most one organization's config, so
  // discovery is an unambiguous single lookup.
  repeated string email_domains = 5;
  // Claim name to read group/role membership from (e.g. "groups") — provider-specific, since IdPs
  // don't agree on where role-ish claims live.
  string role_claim_name = 6;
  // IdP claim value -> platform role wire value (see com.zqnt.utils.auth.PlatformRole), e.g.
  // {"Zequent-Operators": "operator"}. A claim value with no entry here grants no role from it.
  map<string, string> claim_role_mapping = 7;
  bool enabled = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message UpsertIdentityProviderRequest {
  RequestBase base = 1;
  IdentityProviderConfigProtoDTO config = 2;
}

message GetIdentityProviderRequest {
  RequestBase base = 1;
  string organization_id = 2;
}

message FindIdentityProviderByEmailDomainRequest {
  RequestBase base = 1;
  string email = 2;
}

message IdentityProviderResponse {
  bool has_errors = 1;
  ResponseMeta meta = 2;
  // Absent (with has_errors still false) means "no config found" — not every caller of this shape
  // is asking about an org guaranteed to have one, especially FindIdentityProviderByEmailDomain.
  optional IdentityProviderConfigProtoDTO config = 3;
  GlobalErrorMessage error = 4;
}

message FindOidcUserRequest {
  RequestBase base = 1;
  string organization_id = 2;
  string external_subject = 3;
}

message UpsertOidcUserRequest {
  RequestBase base = 1;
  string organization_id = 2;
  // The IdP's own "sub" claim — stable per-user identifier at that IdP, distinct from this
  // platform's own user id.
  string external_subject = 3;
  string email = 4;
  // Roles already resolved from the org's claim_role_mapping — this RPC just persists them, it
  // doesn't re-derive them from raw IdP claims (connector has no reason to know OIDC's claim
  // shapes at all, that resolution happens once, in admin-console).
  repeated string roles = 5;
  // Caller-supplied when the id needs to be known BEFORE this call, same reason as
  // CreateUserRequest.user_id: admin-console reserves a license seat under this exact id first
  // (via FindOidcUser to confirm this is actually a new user), then this call persists the row
  // under that id. Ignored (the existing row's id is kept) when the (organization_id,
  // external_subject) pair already exists — this field only ever matters for first-time
  // provisioning. Server-generated if absent.
  optional string user_id = 6;
}

message PersistSkillExecutionRequest {
  RequestBase base = 1;
  SkillExecutionProtoDTO execution = 2;
}

message AppendSkillExecutionEventRequest {
  RequestBase base = 1;
  SkillExecutionEventProto event = 2;
}

message UpsertAssetPayloadRequest {
  RequestBase base = 1;
  AssetPayloadProtoDTO payload = 2;
  optional string sub_asset_sn = 3;
  optional AssetPayloadOwner owner = 4;
  // Empty means a full upsert; otherwise only listed paths change.
  google.protobuf.FieldMask update_mask = 5;
}

message AssetPayloadOwner {
  oneof owner {
    string asset_id = 1;
    string sub_asset_id = 2;
  }
}

message ListAssetPayloadsRequest {
  RequestBase base = 1;
  AssetPayloadOwner owner = 2;
}

message DeleteAssetPayloadRequest {
  RequestBase base = 1;
  AssetPayloadOwner owner = 2;
  string payload_id = 3;
}

message AssetPayloadResponse {
  string tid = 1;
  bool has_errors = 2;
  optional AssetPayloadProtoDTO payload = 3;
  optional GlobalErrorMessage error = 4;
}

message AssetPayloadListResponse {
  string tid = 1;
  bool has_errors = 2;
  repeated AssetPayloadProtoDTO payloads = 3;
  optional GlobalErrorMessage error = 4;
}

message SetAssetPropertyRequest {
  RequestBase base = 1;
  string sn = 2;
  string key = 3;
  google.protobuf.Value value = 4;
  optional string description = 5;
}

message ListAssetPropertiesRequest {
  RequestBase base = 1;
  string sn = 2;
}

message DeleteAssetPropertyRequest {
  RequestBase base = 1;
  string sn = 2;
  string key = 3;
}

message AssetPropertyResponse {
  string tid = 1;
  bool has_errors = 2;
  optional AssetPropertyProtoDTO property = 3;
  optional GlobalErrorMessage error = 4;
}

