syntax = "proto3";

package zqnt;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.zqnt.utils.common.proto";
option java_outer_classname = "CommonBaseProto";
option go_package = "gen/common/base/proto";

enum ErrorCode{
  ERROR_CODE_SYSTEM = 0;
  ERROR_CODE_CLIENT = 1;
  ERROR_CODE_SDK = 2;
  ERROR_CODE_SERVICE = 3;
  ERROR_CODE_ASSET = 4;
}

message GlobalErrorMessage{
  google.protobuf.Timestamp timestamp = 1;
  string error_message = 2;
  ErrorCode error_code = 3;
}

message RequestBase {
  string tid = 1;           // Transaction ID
  string sn = 2;            // Serial Number / Asset Serial Number
  google.protobuf.Timestamp timestamp = 3;
  optional string asset_id = 4;
  optional string external_id = 5;
  optional string client_id = 6;
  optional string user_id = 7;
}

message ResponseMeta {
  string tid = 1;
  string sn = 2;
  google.protobuf.Timestamp timestamp = 3;
  optional string asset_id = 4;
  optional string response_message = 5;
  optional string external_id = 6;
}

message CommandProgress{
  float progress = 1;
  string state = 2;
  float left_time_in_seconds = 3;
}
